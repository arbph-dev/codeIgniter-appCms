[pytest]
# Ajoute explicitement la racine du projet à sys.path, quel que soit
# le mode d'invocation (pytest, python -m pytest, IDE, etc.).
# Corrige : ModuleNotFoundError: No module named 'acquisition'
# quand pytest est lancé sans __init__.py sous tests/ (mode "prepend"
# par défaut : sans ceci, pytest ajoute le dossier tests/ à sys.path
# au lieu de la racine du projet).
pythonpath = .
testpaths = tests
